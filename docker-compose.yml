services:
  mdv:
    build: .
    image: mdv:latest
    ports:
      - "8080:8080"
    volumes:
      # A named volume keeps notes inside Docker's VM (out of reach of host AV).
      # Swap for a bind mount (e.g. ./vault:/vault) to edit an existing folder.
      - vault:/vault
      # For HTTPS, mount your certificate folder and set MDV_TLS_CERT/MDV_TLS_KEY
      # in .env (see README), e.g.:
      # - /path/to/certs:/certs:ro
    # Secrets such as MDV_PASSWORD live in .env, which git ignores.
    env_file:
      - path: .env
        required: false
    environment:
      # Require a password (strongly recommended if reachable from other machines).
      # MDV_PASSWORD: set it in .env (copy .env.example), not here.

      # Git identity for commits made from the app.
      MDV_GIT_NAME: mdv
      MDV_GIT_EMAIL: mdv@localhost

      # Remote to sync with (MDV_GIT_REMOTE) contains a token, so set it in .env.
      # An empty vault is cloned from it on first start.

      # Commit every 10 minutes when there are changes; also pull + push if true.
      MDV_AUTO_COMMIT: 10m
      MDV_AUTO_PUSH: "true"

      # Where pasted images go when the vault has no Obsidian setting for it.
      # MDV_ATTACHMENTS: attachments
    restart: unless-stopped

volumes:
  vault:
