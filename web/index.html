<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>mdv</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-tabs" role="tablist">
          <button class="sidebar-tab active" data-view="files" role="tab" title="Files (Ctrl+Shift+E)">Files</button>
          <button class="sidebar-tab" data-view="search" role="tab" title="Search (Ctrl+Shift+F)">Search</button>
          <button class="sidebar-tab" data-view="links" role="tab" title="Backlinks &amp; outgoing links (Ctrl+Shift+L)">Links</button>
          <button class="sidebar-tab" data-view="git" role="tab" title="Git (Ctrl+Shift+G)">Git</button>
          <span class="vault-name" id="vault-name"></span>
          <button class="icon-btn" id="open-settings" title="Settings (Ctrl+,)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7 3.4 3.4"/></svg></button>
        </div>

        <section class="view" id="files-view">
          <div class="toolbar">
            <button class="icon-btn" id="new-note" title="New note (Alt+N)"><svg viewBox="0 0 16 16"><path d="M9 1.5H4A1.5 1.5 0 0 0 2.5 3v10A1.5 1.5 0 0 0 4 14.5h8a1.5 1.5 0 0 0 1.5-1.5V6M9 1.5 13.5 6M9 1.5V6h4.5M8 8.5v4M6 10.5h4"/></svg></button>
            <button class="icon-btn" id="new-folder" title="New folder"><svg viewBox="0 0 16 16"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h3l1.5 2H13A1.5 1.5 0 0 1 14.5 6v6a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12zM8 7v4M6 9h4"/></svg></button>
            <button class="icon-btn" id="sort" title="Sort order"><svg viewBox="0 0 16 16"><path d="M4.5 2.5v11M2 11l2.5 2.5L7 11M9 4h5M9 7.5h3.5M9 11h2"/></svg></button>
            <button class="icon-btn" id="collapse-all" title="Collapse all"><svg viewBox="0 0 16 16"><path d="M4.5 6.5 8 3l3.5 3.5M4.5 13 8 9.5l3.5 3.5"/></svg></button>
            <button class="icon-btn" id="reveal" title="Reveal active file"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/></svg></button>
          </div>
          <div class="filter">
            <input id="tree-filter" type="search" placeholder="Filter files…" spellcheck="false" autocomplete="off" />
          </div>
          <nav id="tree" tabindex="0" role="tree" aria-label="Files"></nav>
        </section>

        <section class="view" id="search-view" hidden>
          <div class="search-box">
            <input id="search-input" type="search" placeholder="Search notes…  (path:folder to filter)" spellcheck="false" autocomplete="off" />
            <div class="search-opts">
              <button class="opt" data-opt="case" title="Match case">Aa</button>
              <button class="opt" data-opt="word" title="Whole word"><u>ab</u></button>
              <button class="opt" data-opt="regex" title="Regular expression">.*</button>
            </div>
          </div>
          <div id="search-summary"></div>
          <div id="search-results" tabindex="-1"></div>
        </section>

        <section class="view panel" id="links-view" hidden></section>
        <section class="view panel" id="git-view" hidden></section>
      </aside>
      <div id="resizer"></div>
      <main id="main">
        <div id="tabbar">
          <div id="tabs"></div>
          <button class="icon-btn" id="toggle-map" title="File map (Alt+M)"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h7M2.5 6.5h5M2.5 9.5h7M2.5 12.5h4M12.5 2.5v11"/></svg></button>
        </div>
        <div id="workspace">
          <div id="content">
            <div id="editor"></div>
            <article id="reader" class="reader"></article>
            <div id="viewer" tabindex="-1"></div>
            <div id="empty">
              <p>No file open</p>
              <p class="hint">Pick a note from the tree, or press <kbd>Alt</kbd>+<kbd>N</kbd></p>
            </div>
          </div>
          <aside id="filemap">
            <div id="outline"></div>
            <div id="scrollmap" title="Click or drag to scroll"></div>
          </aside>
        </div>
      </main>
    </div>
    <footer id="status">
      <span id="status-path"></span>
      <button id="status-git" title="Git (Ctrl+Shift+G)"></button>
      <span class="spacer"></span>
      <button id="status-mode" title="Switch mode (Ctrl+E toggles reading view)"></button>
      <span id="status-words"></span>
      <span id="status-pos"></span>
      <span id="status-save"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
